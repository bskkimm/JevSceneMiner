[project]
name = "jevsceneminer"
version = "0.1.0"
description = "Mine driving scenes from logs with Jev: scene script in, scenarios with probabilities and timestamps out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "lanelet2>=1.2.3",
    "mcap>=1.2",
    "mcap-ros2-support>=0.5",
    "numpy>=1.26",
    "pyproj>=3.7.1",
    "pyyaml>=6.0",
    "shapely>=2.1.2",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
jevsceneminer = "jevsceneminer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
