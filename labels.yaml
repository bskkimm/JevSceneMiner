# Labels Jev chooses from, with the plain-language definitions it is given.
# Editing a definition changes the questions, so cached answers are not reused.
#
# A label is either a definition, or {definition, indicator}. ``indicator`` (left, right,
# curb or far) is the turn indicator the maneuver needs; `run --require-indicator` drops
# maneuvers without it. Definitions can say {CURB}/{FAR} (LEFT/RIGHT) and {curb}/{far}
# (left/right): the curb side is the side traffic drives on, set by ``traffic_side``
# (left in e.g. Japan, UK, Singapore; right in e.g. the US) or `--traffic-side`.
version: "jsm-1.0"
traffic_side: left

lateral:
  instructions: >-
    Which lateral maneuver is the ego vehicle performing at NOW (the t=0s line)?
    Use the PAST and FUTURE lines to judge whether NOW is inside a maneuver.
  labels:
    keep_lane: >-
      Staying in its lane, including following road curves and taking one side
      where the road forks. Choose this when none of the other maneuvers
      applies. A stop is keep_lane unless it happens in the middle of a turn,
      U-turn, pull-over or pull-away.
    turn_left:
      indicator: left
      definition: >-
        Turning left at an intersection with the LEFT indicator on: from the
        approach, about 30 m before entering the intersection lane (see ROUTE
        CONTEXT), until the heading is steady again after the turn. The heading
        changes a lot (typically 45 to 150 degrees). If the ego stops during the
        turn (waiting for traffic or a light), the turn continues through the
        stop. The LEFT indicator is required: if it is not on during the maneuver
        (see the indicator lines in SUMMARY and ROUTE CONTEXT), this is keep_lane,
        even when the heading changes a lot.
    turn_right:
      indicator: right
      definition: >-
        Turning right at an intersection with the RIGHT indicator on: from the
        approach, about 30 m before entering the intersection lane (see ROUTE
        CONTEXT), until the heading is steady again after the turn. The heading
        changes a lot (typically 45 to 150 degrees). If the ego stops during the
        turn (waiting for traffic or a light), the turn continues through the
        stop. The RIGHT indicator is required: if it is not on during the maneuver
        (see the indicator lines in SUMMARY and ROUTE CONTEXT), this is keep_lane,
        even when the heading changes a lot.
    u_turn:
      indicator: far
      definition: >-
        Turning around to drive back the way it came, with the {FAR} indicator on:
        the heading changes by about 180 degrees (150 degrees or more) in one
        continuous maneuver, at an intersection, a median opening or across the
        road. From the approach until the heading is steady again in the opposite
        direction, including any stop during it. A turn of less than 150 degrees
        is turn_left or turn_right.
    lane_change_left:
      indicator: left
      definition: >-
        Moving from its lane into the side-by-side neighbor lane on the left,
        from when it starts drifting toward that lane until it has settled in it.
        The LEFT indicator is required; without it, this is keep_lane.
    lane_change_right:
      indicator: right
      definition: >-
        Moving from its lane into the side-by-side neighbor lane on the right,
        from when it starts drifting toward that lane until it has settled in it.
        The RIGHT indicator is required; without it, this is keep_lane.
    avoidance: >-
      Moving sideways to pass a stopped vehicle or obstacle ahead, either within
      its lane or partly leaving it, then returning to its lane. From when it
      starts moving sideways until it is back near the lane center. Not a lane
      change: the ego vehicle does not settle in another lane.
    pull_over:
      indicator: curb
      definition: >-
        From when the {CURB} indicator comes on until the ego vehicle stops at the
        {curb} road edge or shoulder (see next stop in ROUTE CONTEXT).
    pull_away:
      indicator: far
      definition: >-
        From starting to move after a stop at the road edge or shoulder, with the
        {FAR} indicator on, until the ego vehicle is back in the traffic lane.

longitudinal:
  instructions: >-
    How is the ego vehicle's speed changing around NOW, from about 2 s before to
    2 s after the t=0s line?
  labels:
    stopped: Stopped, speed about 0.
    accelerating: Moving and speeding up by more than about 1 m/s.
    decelerating: >-
      Moving and slowing down by more than about 1 m/s, with ordinary braking.
    hard_braking: >-
      Braking unusually hard and suddenly, like an emergency stop: deceleration
      stronger than about 3 m/s² that builds up within about a second.
    cruising: Moving at a roughly steady speed.
