name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} and viewer
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - run: uv sync --frozen --python '${{ matrix.python }}'
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - run: uv run --frozen pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - name: Viewer JavaScript
        run: |
          for file in tests/test_*.cjs; do
            node "$file"
          done
      - name: Clean wheel installation
        run: |
          uv build --wheel
          uv venv /tmp/jevsceneminer-installed --python '${{ matrix.python }}'
          uv pip install --python /tmp/jevsceneminer-installed/bin/python dist/*.whl
          cd /tmp
          /tmp/jevsceneminer-installed/bin/python -I "$GITHUB_WORKSPACE/tools/check_installed.py"
          /tmp/jevsceneminer-installed/bin/jevsceneminer run --help
